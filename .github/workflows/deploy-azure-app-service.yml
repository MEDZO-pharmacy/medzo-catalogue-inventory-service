name: Catalogue service CI and Azure deployment

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: medzo-catalogue-inventory-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Medzo.CatalogueInventory.slnx
      - name: Build
        run: dotnet build src/Medzo.CatalogueInventory.Api/Medzo.CatalogueInventory.Api.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/Medzo.CatalogueInventory.UnitTests/Medzo.CatalogueInventory.UnitTests.csproj -c Release --no-restore && dotnet test tests/Medzo.CatalogueInventory.IntegrationTests/Medzo.CatalogueInventory.IntegrationTests.csproj -c Release --no-restore
      - name: Build container
        run: docker build -f docker/Dockerfile -t ${{ env.IMAGE_NAME }}:ci .

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
      WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      HEALTH_URL: ${{ vars.CATALOGUE_HEALTH_URL }}
      DATABASE_CONNECTION: ${{ secrets.CATALOGUE_DATABASE_CONNECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore deployment dependencies
        run: dotnet restore Medzo.CatalogueInventory.slnx
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${REGISTRY_NAME:?Set AZURE_REGISTRY_NAME}"
          : "${WEBAPP_NAME:?Set AZURE_WEBAPP_NAME}"
          : "${HEALTH_URL:?Set CATALOGUE_HEALTH_URL}"
          : "${DATABASE_CONNECTION:?Set CATALOGUE_DATABASE_CONNECTION}"
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.AZURE_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Apply Azure SQL migrations
        env:
          ConnectionStrings__CatalogueInventory: ${{ secrets.CATALOGUE_DATABASE_CONNECTION }}
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef database update --project src/Medzo.CatalogueInventory.Infrastructure --startup-project src/Medzo.CatalogueInventory.Api
      - name: Build and push container
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -f docker/Dockerfile -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy container
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}
      - name: Verify service health
        shell: bash
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 --max-time 20 "${HEALTH_URL%/}/health"
