name: Test and Deploy Catalogue and Inventory Service

on:
  push:
    branches: [dev]
    paths:
      - '.dockerignore'
      - '.github/workflows/deploy-azure-app-service.yml'
      - 'docker/**'
      - 'src/**'
      - 'tests/**'
      - 'Medzo.CatalogueInventory.slnx'
      - 'dotnet-tools.json'
  workflow_dispatch:

concurrency:
  group: medzo-catalogue-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: medzo-pharmacy/medzo-catalogue-inventory-service
  CONTAINER_APP_NAME: medzo-catalogue-service
  RESOURCE_GROUP: rg-MEDZO-NEW

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and test
        run: |
          dotnet restore Medzo.CatalogueInventory.slnx
          dotnet test tests/Medzo.CatalogueInventory.UnitTests/Medzo.CatalogueInventory.UnitTests.csproj --configuration Release --no-restore
          dotnet test tests/Medzo.CatalogueInventory.IntegrationTests/Medzo.CatalogueInventory.IntegrationTests.csproj --configuration Release --no-restore

      # The API does not migrate at startup. Keep the Azure SQL schema current
      # before rolling out code that depends on new tables or indexes.
      - name: Apply Azure SQL migrations
        env:
          ConnectionStrings__CatalogueInventory: ${{ secrets.CATALOGUE_DATABASE_CONNECTION }}
        run: |
          if [ -z "$ConnectionStrings__CatalogueInventory" ]; then
            echo "::error::Set the CATALOGUE_DATABASE_CONNECTION Actions secret for Azure SQL migrations."
            exit 1
          fi
          dotnet tool restore
          for attempt in 1 2 3 4 5; do
            if dotnet tool run dotnet-ef database update \
              --project src/Medzo.CatalogueInventory.Infrastructure \
              --startup-project src/Medzo.CatalogueInventory.Api; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Azure SQL migration attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Azure SQL migrations failed after 5 attempts. Check Azure SQL firewall access and the CATALOGUE_DATABASE_CONNECTION secret."
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        run: |
          docker build -f docker/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure using OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.REGISTRY }}

      - name: Verify deployed health endpoint
        uses: azure/cli@v2
        with:
          inlineScript: |
            fqdn=$(az containerapp show --name "${{ env.CONTAINER_APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query 'properties.configuration.ingress.fqdn' --output tsv)
            test -n "$fqdn"
            curl --fail --retry 6 --retry-all-errors --retry-delay 10 "https://$fqdn/health"
